services:
  - type: web
    name: trendhacker
    runtime: python
    buildCommand: pip install -r requirements.txt
    # Threaded worker, not gevent: gevent patches SSL after gunicorn has already
    # imported it, which crashes HTTPS calls with "maximum recursion depth exceeded".
    startCommand: gunicorn --worker-class gthread --workers 1 --threads 8 --bind 0.0.0.0:$PORT --timeout 120 web.app:app
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SERPER_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9

services:
  - type: web
    name: trendhacker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class gevent --workers 2 --bind 0.0.0.0:$PORT --timeout 120 web.app:app
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SERPER_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9
